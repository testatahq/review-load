[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-load"
version = "0.1.0"
description = "Who is carrying code review on one GitHub repo: review load, bus factor, time to first review, PR size vs wait."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Testata", email = "raul@testata.co" }]
maintainers = [{ name = "Testata", email = "raul@testata.co" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["code review", "github", "pull requests", "engineering metrics", "bus factor"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://testata.co"
Source = "https://github.com/testata-co/review-load"

[project.scripts]
review-load = "review_load.cli:main"

[tool.setuptools]
packages = ["review_load"]
